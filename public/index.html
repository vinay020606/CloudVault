<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault Gateway</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.5;
            padding: 24px;
            max-width: 1000px;
            margin: 0 auto;
        }

        h1, h2, h3 {
            font-weight: 600;
            color: #000000;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 16px;
            border-bottom: 2px solid #000000;
            margin-bottom: 24px;
        }

        .tenant-info {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        button, .btn {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #000000;
            padding: 6px 14px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 2px;
        }

        button:hover, .btn:hover {
            background-color: #333333;
        }

        button.btn-outline {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }

        button.btn-outline:hover {
            background-color: #f0f0f0;
        }

        button.btn-danger {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
        }

        button.btn-danger:hover {
            background-color: #000000;
            color: #ffffff;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-card {
            border: 1px solid #000000;
            padding: 12px;
            background-color: #ffffff;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #444444;
        }

        .stat-value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 4px;
        }

        .section-box {
            border: 1px solid #000000;
            padding: 20px;
            margin-bottom: 24px;
            background-color: #ffffff;
        }

        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            font-weight: 500;
        }

        input[type="file"], input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #000000;
            background-color: #ffffff;
            color: #000000;
            font-size: 14px;
        }

        .upload-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
            align-items: center;
        }

        .status-msg {
            margin-top: 12px;
            font-size: 14px;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
        }

        th, td {
            border: 1px solid #000000;
            padding: 10px;
            text-align: left;
            font-size: 14px;
        }

        th {
            background-color: #f0f0f0;
            font-weight: 600;
        }

        .table-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CloudVault Gateway</h1>
        <div class="tenant-info">
            <span>Tenant: <strong id="activeUser">tenant-alex</strong></span>
            <button class="btn-outline" onclick="switchTenantPrompt()">Switch Tenant</button>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label">Total Files</div>
            <div class="stat-value" id="statFiles">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Storage Used</div>
            <div class="stat-value" id="statBytes">0 B</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Hot Cache</div>
            <div class="stat-value" id="statHot">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label">Glacier Cold</div>
            <div class="stat-value" id="statCold">0</div>
        </div>
    </div>

    <div class="section-box">
        <h2 style="font-size: 16px; margin-bottom: 12px;">Upload File</h2>
        <form onsubmit="handleUploadSubmit(event)">
            <div class="form-group">
                <label for="fileSelector">Select File</label>
                <input type="file" id="fileSelector" required>
            </div>
            <div class="form-group">
                <label for="customPathInput">Destination Path (Optional)</label>
                <input type="text" id="customPathInput" placeholder="e.g. docs/report.pdf">
            </div>
            <div class="upload-actions">
                <button type="submit">Upload File</button>
            </div>
        </form>
        <div id="uploadStatus" class="status-msg"></div>
    </div>

    <div class="section-box">
        <div class="table-header-row">
            <h2 style="font-size: 16px;">Files List</h2>
            <button class="btn-outline" onclick="loadFiles()">Refresh</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>File Path</th>
                    <th>Size</th>
                    <th>Storage Tier</th>
                    <th style="width: 160px; text-align: center;">Actions</th>
                </tr>
            </thead>
            <tbody id="filesTableBody">
                <tr>
                    <td colspan="4" style="text-align: center; color: #666;">No files stored for this tenant.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_BASE = '/api/v1/gateway';
        let currentTenantId = 'tenant-alex';

        window.addEventListener('DOMContentLoaded', () => {
            loadFiles();
        });

        function switchTenantPrompt() {
            const input = prompt('Enter Tenant ID:', currentTenantId);
            if (input && input.trim()) {
                currentTenantId = input.trim().toLowerCase();
                document.getElementById('activeUser').textContent = currentTenantId;
                loadFiles();
            }
        }

        async function loadFiles() {
            try {
                const res = await fetch(`${API_BASE}/files`, {
                    headers: { 'x-tenant-id': currentTenantId }
                });
                const data = await res.json();
                const files = data.files || [];
                renderFiles(files);
            } catch (err) {
                console.warn('Failed listing files:', err);
            }
        }

        function renderFiles(files) {
            const tbody = document.getElementById('filesTableBody');
            tbody.innerHTML = '';

            const totalBytes = files.reduce((acc, f) => acc + (f.sizeBytes || 0), 0);
            document.getElementById('statFiles').textContent = files.length;
            document.getElementById('statBytes').textContent = formatBytes(totalBytes);
            document.getElementById('statHot').textContent = files.filter(f => f.currentTier === 'HOT').length;
            document.getElementById('statCold').textContent = files.filter(f => f.currentTier === 'COLD').length;

            if (files.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="4" style="text-align: center; color: #666;">No files stored for this tenant.</td>
                    </tr>
                `;
                return;
            }

            files.forEach(f => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${escapeHtml(f.filePath)}</strong></td>
                    <td>${formatBytes(f.sizeBytes)}</td>
                    <td>${escapeHtml(f.currentTier || 'HOT')}</td>
                    <td style="text-align: center;">
                        <button class="btn-outline" style="padding: 2px 8px; font-size: 12px;" onclick="downloadFile('${escapeHtml(f.filePath)}')">Download</button>
                        <button class="btn-danger" style="padding: 2px 8px; font-size: 12px; margin-left: 4px;" onclick="deleteFile('${escapeHtml(f.filePath)}')">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function handleUploadSubmit(e) {
            e.preventDefault();
            const fileInput = document.getElementById('fileSelector');
            const statusDiv = document.getElementById('uploadStatus');
            const fileObj = fileInput.files[0];

            if (!fileObj) return alert('Please select a file');

            const customPath = document.getElementById('customPathInput').value.trim();
            const targetPath = customPath || fileObj.name;

            statusDiv.textContent = `Uploading ${fileObj.name}...`;

            const formData = new FormData();
            formData.append('filePath', targetPath);
            formData.append('file', fileObj);

            try {
                const res = await fetch(`${API_BASE}/upload?filePath=${encodeURIComponent(targetPath)}`, {
                    method: 'POST',
                    headers: { 'x-tenant-id': currentTenantId },
                    body: formData
                });

                if (res.ok) {
                    statusDiv.textContent = `File uploaded successfully.`;
                    fileInput.value = '';
                    document.getElementById('customPathInput').value = '';
                    setTimeout(() => statusDiv.textContent = '', 3000);
                    loadFiles();
                } else {
                    const data = await res.json();
                    throw new Error(data.error || 'Upload failed');
                }
            } catch (err) {
                statusDiv.textContent = `Upload error: ${err.message}`;
            }
        }

        async function downloadFile(filePath) {
            try {
                const res = await fetch(`${API_BASE}/download?filePath=${encodeURIComponent(filePath)}`, {
                    headers: { 'x-tenant-id': currentTenantId }
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filePath.split('/').pop() || 'download';
                document.body.appendChild(a);
                a.click();
                a.remove();
            } catch (err) {
                alert(`Download error: ${err.message}`);
            }
        }

        async function deleteFile(filePath) {
            if (!confirm(`Delete ${filePath}?`)) return;
            try {
                const res = await fetch(`${API_BASE}/files?filePath=${encodeURIComponent(filePath)}`, {
                    method: 'DELETE',
                    headers: { 'x-tenant-id': currentTenantId }
                });
                if (res.ok) {
                    loadFiles();
                } else {
                    throw new Error('Delete failed');
                }
            } catch (err) {
                alert(`Delete error: ${err.message}`);
            }
        }

        function formatBytes(bytes) {
            if (!bytes || bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        function escapeHtml(str = '') {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }
    </script>
</body>
</html>
