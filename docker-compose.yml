version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cloudvault-mysql
    restart: always
    environment:
      MYSQL_DATABASE: cloudvault
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: cloudvault-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: cloudvault-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: cloudvault
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOCAL_BLOCKS_DIR: /usr/src/app/storage/blocks
      TENANTS_STORAGE_DIR: /usr/src/app/storage/tenants
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - app_storage:/usr/src/app/storage

volumes:
  mysql_data:
  redis_data:
  app_storage:
