version: '3.8'

# Full demo stack with LocalStack (simulates AWS S3 locally — no real AWS account needed)
# Usage: docker-compose -f docker-compose.demo.yml up --build

services:

  mysql:
    image: mysql:8.0
    container_name: cloudvault-demo-mysql
    restart: always
    environment:
      MYSQL_DATABASE: cloudvault
      MYSQL_ROOT_PASSWORD: demo_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_demo_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pdemo_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:alpine
    container_name: cloudvault-demo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_demo_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: cloudvault-demo-localstack
    restart: always
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - EAGER_SERVICE_LOADING=1
    volumes:
      - localstack_demo_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: cloudvault-demo-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # JWT
      JWT_SECRET: demo_jwt_secret_change_before_real_use
      # MySQL
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: demo_pass
      MYSQL_DATABASE: cloudvault
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Storage
      TENANTS_STORAGE_DIR: /usr/src/app/storage/tenants
      LOCAL_BLOCKS_DIR: /usr/src/app/storage/blocks
      MAX_CACHE_SIZE_BYTES: 104857600
      # AWS — points to LocalStack, uses dummy credentials
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_ENDPOINT: http://localstack:4566
      HOT_BUCKET: cloudvault-hot
      COLD_BUCKET: cloudvault-cold
      TIERING_INACTIVITY_DAYS: 1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    volumes:
      - app_demo_storage:/usr/src/app/storage

volumes:
  mysql_demo_data:
  redis_demo_data:
  localstack_demo_data:
  app_demo_storage:
